name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_WEATHER_API_URL: https://api.openweathermap.org/data/2.5/weather
      NEXT_PUBLIC_FORECAST_API_URL: https://api.openweathermap.org/data/2.5/forecast
      NEXT_PUBLIC_API_KEY: dummy-ci-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run format:check
      - run: npm run build
