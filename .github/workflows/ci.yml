name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_WEATHER_API_URL: https://api.openweathermap.org/data/2.5/weather
      NEXT_PUBLIC_FORECAST_API_URL: https://api.openweathermap.org/data/2.5/forecast
      NEXT_PUBLIC_API_KEY: dummy-ci-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run format:check
      - run: npm run build
