# Zero-code alternative: Settings -> General -> "Automatically delete head branches".
# This workflow is delivered because it was explicitly requested and is version-controlled;
# the user may ALSO enable the repo setting above in addition to this workflow.
name: Branch cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${context.payload.pull_request.head.ref}`,
              })
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(`Branch already deleted or not found: ${error.message}`)
              } else {
                throw error
              }
            }
